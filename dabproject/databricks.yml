# This is a Declarative Automation Bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: 208d4d70-d5f7-41b0-9bd2-2373c9f7ab03

include:
  - resources/*.yml



# Variable declarations. These variables are assigned in the dev/prod targets below.

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-bb428be7-bf72.cloud.databricks.com/
    
  prod:
    mode: production
    workspace:
      host: https://dbc-bb428be7-bf72.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/kunderprajwal03@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kunderprajwal03@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    
    permissions:
      - group_name: admins
        level: CAN_MANAGE
